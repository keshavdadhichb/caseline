server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The app calls relative /api/... paths everywhere (see src/api.ts BASE),
    # so proxying here means the frontend code needs no build-time API_BASE
    # and no changes between docker-compose (proxies to the `backend`
    # service) and Vercel (proxies to the hosted backend via vercel.json).
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 90s;
    }

    # SPA fallback: any non-file route resolves to index.html.
    location / {
        try_files $uri /index.html;
    }
}
